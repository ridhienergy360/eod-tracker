<style>
:root{--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e5e7eb;--bg:#f4f5f9;--card:#fff;--accent:#a3e635;--accent-d:#4d7c0f;--ok:#047857;--ok-bg:#d1fae5;--warn:#92400e;--warn-bg:#fef3c7;--bad:#991b1b;--bad-bg:#fee2e2;--info:#1e40af;--info-bg:#dbeafe;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
h1{font-size:26px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
h3.section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px}
.muted{color:var(--muted);font-size:14px}
.opt{color:var(--muted);font-weight:500;font-size:13px}
/* top bar + nav */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:17px;line-height:1.1}
.brand small{display:block;font-weight:700;color:var(--muted);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.spacer{flex:1}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;border:0;padding:0}
.sync-dot.ok{background:#22c55e}.sync-dot.syncing{background:#f59e0b}.sync-dot.err{background:#ef4444}
.user-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.container{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.nav-btn{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.nav-btn .ic{font-size:21px;line-height:1}
.nav-btn.active{color:var(--ink);background:#ecfccb}
.nav-badge{position:absolute;top:1px;right:16%;background:#ef4444;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card-header{margin-bottom:10px}.card-title{font-size:17px;font-weight:800;margin:0}.card-subtitle{display:none}
label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.check{display:flex;align-items:center;gap:10px;font-weight:600;margin:12px 0}
label.check input{width:20px;height:20px}
.input-ctrl,.select-ctrl,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:16px;font-family:inherit;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.input-ctrl:focus,.select-ctrl:focus,textarea:focus{outline:none;border-color:#84cc16;box-shadow:0 0 0 3px rgba(163,230,53,.35)}
.has-error{border-color:#ef4444!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2.keep{grid-template-columns:1fr 1fr}.row2:not(.keep){grid-template-columns:1fr}}
.error{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:11px 13px;font-size:14px;margin:12px 0}
.note{border-radius:12px;padding:11px 13px;font-size:14px;margin:0 0 14px}
.note.ok{background:var(--ok-bg);color:var(--ok)}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.info{background:var(--info-bg);color:var(--info)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:1.5px solid transparent;font-size:16px;font-weight:800;padding:12px 16px;margin-top:14px}
.btn:disabled{opacity:.55;cursor:default}
.btn-dark{background:var(--ink);color:#fff}
.btn-accent{background:var(--accent);color:#1a2e05}
.btn-outline{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-ok{background:var(--ok-bg);color:var(--ok)}
.btn-xl{min-height:58px;font-size:18px}
.btn-sm{width:auto;min-height:40px;font-size:14px;padding:8px 14px;margin-top:0;border-radius:11px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap}.btn-group .btn{flex:1;min-width:140px}
.preset-btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink)}
.preset-btn.active-toggle,.preset-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:14px;margin-top:14px;padding:6px 0;display:block;width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* chips */
.chip,.fw-chip,.tag-pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:#eef0f4;color:var(--ink2);white-space:nowrap}
.chip.ok,.fw-chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn,.fw-chip.wait{background:var(--warn-bg);color:var(--warn)}.chip.bad,.fw-chip.warn{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.fw-chip{margin-left:6px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{flex:1;min-width:84px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button.on.s-done{background:#047857;border-color:#047857}.seg button.on.s-blocked{background:#b91c1c;border-color:#b91c1c}.seg button.on.s-prog{background:#1d4ed8;border-color:#1d4ed8}
/* hero + home */
.hello{margin:4px 2px 16px}.hello p{margin:0;color:var(--muted);font-size:15px}
.hero{background:linear-gradient(160deg,#0f172a,#1e293b);color:#fff;border:0;text-align:center;padding:24px 18px}
.hero .hero-clock{font-size:40px;font-weight:800;letter-spacing:-.02em}
.hero .hero-sub{color:#cbd5e1;margin:2px 0 6px}
.hero .link{color:#cbd5e1}
.task-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;font-size:15px;color:var(--ink)}
.task-row:last-child{border-bottom:0}
.task-row .t{font-weight:700;min-width:0}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.task .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task .ttl{font-weight:800;font-size:16px}
.task textarea{min-height:64px;margin-top:6px}
/* list items + log cards */
.fw-item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff;font-size:14.5px;line-height:1.5}
.log-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.log-card.has-issue{border-left:5px solid #f59e0b}
.log-header{margin-bottom:8px}.log-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.log-name{font-weight:800;font-size:16px;margin-right:4px}
.log-block{margin-top:8px}.log-block-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.log-block-body{margin:0;white-space:pre-wrap;font-size:14.5px}
.log-block.issue .log-block-title{color:#b45309}
.status-tag{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px}
.status-tag.ok{background:var(--ok-bg);color:var(--ok)}.status-tag.warn{background:var(--warn-bg);color:var(--warn)}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi-number{font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi-sub{font-size:12.5px;color:var(--muted)}
.filters-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters-row>.btn,.filters-row .btn-outline{margin-top:0}
.roster-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.roster-item:last-child{border-bottom:0}.roster-name{font-weight:700}
.chips-pick{display:flex;gap:8px;flex-wrap:wrap}
.chips-pick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700}
.chips-pick button.on{background:#ecfccb;border-color:#84cc16;color:#1a2e05}
/* login + modal + toast */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 10px 40px rgba(15,23,42,.08)}
.login-logo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 12px}
.brand-logo{display:block;height:36px;width:auto}
.login-card h1,.login-card>.muted{text-align:center}
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x-btn{border:0;background:#eef0f4;border-radius:50%;width:34px;height:34px;font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:70;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>

<template id="tpl-e-home">
  <div class="hello"><h1 id="hm-hello"></h1><p id="hm-date"></p></div>
  <div id="hm-leave"></div>
  <div id="hm-tasks"></div>
  <div id="hm-punch" class="card hero hidden">
    <div class="hero-clock" id="punch-clock"></div>
    <p class="hero-sub">Ready to start your day?</p>
    <div id="punch-error" class="error hidden" style="text-align:left;"></div>
    <button class="btn btn-accent btn-xl" id="btn-punch-in" data-act="punch-in"><span>📍 Punch in</span></button>
    <button class="link" data-act="open-manual">Forgot to punch in? Add a missed day</button>
  </div>
  <div id="hm-eod" class="card hidden">
    <div class="pill-row"><span class="chip ok">🟢 Punched in</span><strong id="hm-since"></strong></div>
    <p id="hm-where" class="muted" style="margin:6px 0 0;"></p>
    <label for="eod-activities">What did you do today? <span class="req">*</span></label>
    <textarea id="eod-activities" rows="4" placeholder="Work done, sites visited, calls, follow-ups…"></textarea>
    <label>Any problem or support needed?</label>
    <div class="seg"><button type="button" id="btn-flag-smooth" data-act="flag" data-val="smooth" class="on">✅ All smooth</button><button type="button" id="btn-flag-issue" data-act="flag" data-val="issue">⚠️ Need support</button></div>
    <textarea id="eod-issues" class="hidden" rows="2" placeholder="What is blocking you?"></textarea>
    <label for="eod-tomorrow">Plan for tomorrow <span class="opt">(optional)</span></label>
    <textarea id="eod-tomorrow" rows="2"></textarea>
    <label for="eod-logout">Logout time</label>
    <input type="time" id="eod-logout" class="input-ctrl" />
    <p class="muted" id="eod-duration" style="margin:8px 0 0;"></p>
    <div id="eod-error" class="error hidden"></div>
    <button class="btn btn-dark btn-xl" id="btn-submit-eod" data-act="submit-eod"><span>Submit end-of-day report</span></button>
  </div>
  <div id="hm-done" class="card hidden"></div>
  <div id="hm-recent"></div>
</template>

<template id="tpl-e-leave">
  <div class="hello"><h1>Leave</h1></div>
  <div class="card">
    <label for="lv-type" style="margin-top:0;">Type</label>
    <select id="lv-type" class="select-ctrl"><option>Casual Leave</option><option>Sick Leave</option><option>Paid Leave</option><option>Unpaid Leave</option><option>Other</option></select>
    <div class="row2 keep"><div><label for="lv-from">From</label><input type="date" id="lv-from" class="input-ctrl" /></div><div><label for="lv-to">To</label><input type="date" id="lv-to" class="input-ctrl" /></div></div>
    <label class="check hidden" id="lv-half-wrap"><input type="checkbox" id="lv-half" /> Half day</label>
    <label for="lv-reason">Reason <span class="opt" id="lv-reason-hint">(optional)</span></label>
    <textarea id="lv-reason" rows="2"></textarea>
    <div id="lv-error" class="error hidden"></div>
    <button class="btn btn-dark btn-xl" id="btn-lv-submit" data-act="lv-submit"><span>Submit request</span></button>
  </div>
  <h3 class="section">My requests</h3>
  <div id="lv-list"></div>
</template>

<template id="tpl-e-tasks">
  <div class="hello"><h1>My tasks</h1></div>
  <div id="tk-list"></div>
</template>

<template id="tpl-e-visits">
  <div class="hello"><h1>Site visits</h1></div>
  <div class="card">
    <label for="ev-site" style="margin-top:0;">Site / client name</label>
    <input type="text" id="ev-site" class="input-ctrl" maxlength="120" list="site-list" autocomplete="off" placeholder="e.g. ABC Pvt Ltd - Plant 2" />
    <datalist id="site-list"></datalist>
    <label for="ev-purpose">Purpose <span class="opt">(optional)</span></label>
    <input type="text" id="ev-purpose" class="input-ctrl" maxlength="200" autocomplete="off" />
    <div id="ev-error" class="error hidden"></div>
    <div id="ev-ok" class="note ok hidden" style="margin-top:12px;"></div>
    <button class="btn btn-accent btn-xl" id="btn-ev-checkin" data-act="checkin"><span>📍 Check in here</span></button>
  </div>
  <h3 class="section">Today</h3>
  <div id="ev-list"></div>
</template>

<template id="tpl-e-expenses">
  <div class="hello"><h1>Expenses</h1></div>

var LOGS = [];

      function byId(id) {

      function escHtml(raw) {
        return String(raw == null ? "" : raw)
          .split("&").join("&amp;")

          .split(">").join("&gt;")
          .split('"').join("&quot;")
          .split("'").join("&#39;");
      }

      function normalizeSpaces(raw) {
        var parts = String(raw == null ? "" : raw).trim().split(" ");
        var out = [];
        for (var i = 0; i < parts.length; i++) {
          if (parts[i]) out.push(parts[i]);
        }
        return out.join(" ");
      }

      function singleLine(raw) {
        var lines = String(raw == null ? "" : raw).split("\r").join("").split("\n");
        var out = [];
        for (var i = 0; i < lines.length; i++) {
          var t = lines[i].trim();
          if (t) out.push(t);
        }
        return out.join("; ");
      }

      function pad2(n) {
        var num = Number(n) || 0;
        return num < 10 ? "0" + num : String(num);
      }

      function todayISO() {
        var d = new Date();
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      }

      function parseISO(iso) {
        if (!iso || typeof iso !== "string") return null;
        var p = iso.split("-");
        if (p.length !== 3) return null;
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return isNaN(d.getTime()) ? null : d;
      }

      function prettyDate(iso) {
        var d = parseISO(iso);
        if (!d) return iso || "";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return pad2(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear();
      }

      function prettyTime12(hhmm) {
        if (!hhmm || hhmm.indexOf(":") === -1) return hhmm || "";
        var p = hhmm.split(":");
        var h = parseInt(p[0], 10);
        var m = p[1] || "00";
        if (isNaN(h)) return hhmm;
        var ampm = h >= 12 ? "PM" : "AM";
        var h12 = h % 12;
        if (h12 === 0) h12 = 12;
        return pad2(h12) + ":" + m + " " + ampm;
      }

      function calcShiftMins(loginVal, logoutVal) {
        if (!loginVal || !logoutVal) return 0;
        var a = loginVal.split(":");
        var b = logoutVal.split(":");
        if (a.length < 2 || b.length < 2) return 0;
        var m1 = parseInt(a[0], 10) * 60 + parseInt(a[1], 10);
        var m2 = parseInt(b[0], 10) * 60 + parseInt(b[1], 10);
        if (isNaN(m1) || isNaN(m2)) return 0;
        var diff = m2 - m1;
        if (diff < 0) diff += 1440;
        return diff;
      }

      function formatDuration(mins) {
        var total = Number(mins) || 0;
        if (total <= 0) return "0h 00m";
        var h = Math.floor(total / 60);
        var m = total % 60;
        return h + "h " + pad2(m) + "m";
      }



function getCurrentExecUrl() { return DEFAULT_EXEC_URL; }
function getAdminCode() { return SafeStorage.get(KEYS.ADMIN_CODE) || ""; }

function val(id) { var e = byId(id); return e ? e.value : ""; }
function setVal(id, v) { var e = byId(id); if (e) e.value = v; }
function rand4() { return Math.floor(Math.random() * 10000); }

function prettyLong(iso) {

  var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()];
}
function greeting() { var h = new Date().getHours(); return h < 12 ? "Good morning" : (h < 17 ? "Good afternoon" : "Good evening"); }
function formatINR(n) {
  var v = Number(n) || 0;
  try { return "₹" + v.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } catch (e) { return "₹" + v.toFixed(2); }
}

/* ---------- toast + modal ---------- */

function downloadSafe(content, filename, mime) {
  try {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);

  } catch (e) {
    showToast("Download is not available in this browser.");
  }
}

function copyText(text) {

    ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);

}

/* ---------- network ---------- */
function setSync(mode) {
  var d = byId("sync-dot");
  if (d) d.className = "sync-dot " + mode;
}

function execGet(params, cb) {
  var done = false;
  function fin(v) { if (done) return; done = true; cb(v); }
  var timer = setTimeout(function () { fin(null); }, 15000);
  try {
    var url = getCurrentExecUrl();
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    var qs = [];
    for (var k in params) {
      if (Object.prototype.hasOwnProperty.call(params, k)) qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
    }
    qs.push("_ts=" + Date.now());
    fetch(url + sep + qs.join("&"), { method: "GET", redirect: "follow" })
      .then(function (res) { return res.text(); })
      .then(function (txt) {
        clearTimeout(timer);
        var d = null;
        try { d = JSON.parse(txt); } catch (e) { d = null; }
        fin(d);
      })
      .catch(function () { clearTimeout(timer); fin(null); });
  } catch (e) { clearTimeout(timer); fin(null); }
}

function post(payload) {
  setSync("syncing");
  try {
    return fetch(getCurrentExecUrl(), {
      method: "POST", mode: "no-cors", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload || {})
    }).then(function () { setSync("ok"); }).catch(function () { setSync("err"); showToast("No internet. Please try again."); });
  } catch (e) { setSync("err"); return { then: function () {} }; }
}

/* poll a check up to 3 times (saves are fire-and-forget, so we confirm by reading back) */
function confirmSave(check, okCb, failCb) {
  var attempt = 0;
  function go() {
    attempt++;
    setTimeout(function () {
      check(function (ok) {
        if (ok) okCb();
        else if (attempt < 3) go();
        else failCb();
      });
    }, attempt === 1 ? 3500 : 5500);
  }
  go();
}

  var logoutVal = String(raw.logoutTime || raw.logout || "");
  var statusVal = String(raw.status || "").toLowerCase() === "in" ? "in" : "done";
  var mins = typeof raw.durationMinutes === "number" ? raw.durationMinutes : calcShiftMins(loginVal, logoutVal);
  var issDetails = String(raw.issueDetails != null ? raw.issueDetails : (raw.issues || ""));
  var createdMs = Number(raw.createdAtMs || raw.createdAt || Date.parse(raw.submittedAt || "") || Date.now());
  return {
    id: id || ("EOD-" + createdMs + "-" + rand4()),
    date: dateStr || todayISO(),
    employeeName: empName,
    loginTime: loginVal,
    loginLocation: String(raw.loginLocation || raw.location || ""),

function pullFromSheet(cb) {
  execGet({}, function (data) {
    if (!data || data.ok !== true) { setSync("err"); UI.rosterFailed = true; refreshLoginRoster(); if (!UI.rosterRetry) { UI.rosterRetry = true; setTimeout(function () { UI.rosterRetry = false; if (UI.rosterFailed) pullFromSheet(); }, 6000); } if (cb) cb(false); return; }
    UI.rosterFailed = false;
    PINSET = {};
    if (Array.isArray(data.pins)) for (var pi = 0; pi < data.pins.length; pi++) PINSET[String(data.pins[pi]).trim().toLowerCase()] = true;

    var logMap = {};
    for (var i = 0; i < LOGS.length; i++) logMap[LOGS[i].id] = LOGS[i];
    var remote = Array.isArray(data.logs) ? data.logs : [];
    var remoteIds = {}, resend = [], resendEdits = [];
    for (var r = 0; r < remote.length; r++) {
      var norm = normalizeLog(remote[r]);
      if (!norm) continue;
      remoteIds[norm.id] = true;
      var ex = logMap[norm.id];
      if (ex && ex.status === "done" && norm.status === "in") resend.push(ex);
      else if (ex && ex.pending && String(ex.editedAt || "") > String(norm.editedAt || "")) resendEdits.push(ex);
      else { norm.pending = false; logMap[norm.id] = norm; }
    }
    var merged = [];
    var ids = Object.keys(logMap);
    for (var k = 0; k < ids.length; k++) if (remoteIds[ids[k]] || logMap[ids[k]].pending) merged.push(logMap[ids[k]]);
    LOGS = merged;
    persistLogs();

    if (SESSION && !IS_ADMIN) {
      for (var a = 0; a < resend.length; a++) if (sameName(resend[a].employeeName, SESSION.name)) postMine({ action: "save_log", log: toSheetLog(resend[a]) });
      for (var b = 0; b < resendEdits.length; b++) if (sameName(resendEdits[b].employeeName, SESSION.name)) postMine({ action: "edit_log", log: editPayload(resendEdits[b]) });
    }

  });
}

function mergeMine(local, remote, same) {
  var out = [], rmap = {};
  for (var i = 0; i < remote.length; i++) rmap[remote[i].id] = remote[i];
  for (var j = 0; j < remote.length; j++) {
    var r = remote[j], l = null;
    for (var k = 0; k < local.length; k++) if (local[k].id === r.id) { l = local[k]; break; }
    if (l && l._pending && !same(l, r)) out.push(l); else out.push(r);
  }
  for (var m = 0; m < local.length; m++) if (local[m]._pending && !rmap[local[m].id]) out.push(local[m]);
  return out;
}

    if (a.priority !== b.priority) return a.priority === "High" ? -1 : 1;
    return String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999"));
  });
  return out;
}

function dueChip(t) {
  if (!t.dueDate) return "";
  var over = t.status !== "Done" && t.dueDate < todayISO();
  return '<span class="chip ' + (over ? "bad" : (t.dueDate === todayISO() ? "warn" : "")) + '">' + (over ? "Overdue · " : "Due ") + escHtml(prettyDate(t.dueDate)) + "</span>";
}
function statusClass(s) { return s === "Done" ? "ok" : (s === "Blocked" ? "bad" : (s === "In Progress" ? "info" : "warn")); }

function renderHomeTasks() {
  var open = openTasks();

    html = '<div class="card"><div class="pill-row" style="justify-content:space-between;margin-bottom:4px;"><h2 style="margin:0;">📝 Your tasks</h2><span class="chip warn">' + open.length + " open</span></div>";

    }

}

function renderHome() {

function updateDuration(open) {

function showErr(id, msg, el) {
  var e = byId(id);

  if (el) { el.classList.add("has-error"); try { el.focus(); } catch (x) {} }
}
function clearErr(id) { var e = byId(id); if (e) e.classList.add("hidden"); }
function clearFieldErrors(ids) { for (var i = 0; i < ids.length; i++) { var e = byId(ids[i]); if (e) e.classList.remove("has-error"); } }

function punchIn() {
  if (UI.busy) return;
  clearErr("punch-error");
  if (findOpenPunch(SESSION.name)) { renderHome(); return; }
  UI.busy = true;
  var btn = byId("btn-punch-in");
  setBtnBusy(btn, true, "📍 Getting your location…");
  getGps(function (g) {
    if (!g) { UI.busy = false; setBtnBusy(btn, false); showErr("punch-error", GPS_REQUIRED_MSG); return; }
    reverseGeocode(g, function (addr) {
      var nowMs = Date.now();
      var entry = {
        id: "EOD-" + nowMs + "-" + rand4(), date: todayISO(), employeeName: SESSION.name,
        loginTime: nowHHMM(), loginLocation: "GPS location", loginGps: gpsToStr(g), loginAddress: addr || "",
        logoutGps: "", logoutAddress: "", logoutTime: "", durationMinutes: 0, durationText: "",
        activities: "", hasIssue: false, issueDetails: "", tomorrowPlan: "", status: "in",
        pending: true, createdAtMs: nowMs, submittedAt: new Date(nowMs).toISOString()
      };
      LOGS.unshift(entry); persistLogs();
      postMine({ action: "save_log", log: toSheetLog(entry) });
      confirmLog(entry, "save");
      UI.busy = false; UI.forcePunch = false; setBtnBusy(btn, false);
      renderAll();
      showToast("Punched in at " + prettyTime12(entry.loginTime));
    });
  });
}

function submitEod() {
  if (UI.busy) return;
  clearErr("eod-error"); clearFieldErrors(["eod-activities", "eod-logout", "eod-issues"]);
  var open = findOpenPunch(SESSION.name);
  if (!open) { renderHome(); return; }
  var logout = val("eod-logout"), act = val("eod-activities").trim(), issue = val("eod-issues").trim(), tom = val("eod-tomorrow").trim();
  if (!logout) { showErr("eod-error", "Please set your logout time.", byId("eod-logout")); return; }
  if (!act) { showErr("eod-error", "Please write what you did today.", byId("eod-activities")); return; }
  var hasIssue = UI.issueFlag === "issue" || issue.length > 0;
  if (hasIssue && !issue) issue = "Support / blocker flagged.";
  UI.busy = true;
  var btn = byId("btn-submit-eod");
  setBtnBusy(btn, true, "📍 Getting your location…");
  getGps(function (g) {
    if (!g) { UI.busy = false; setBtnBusy(btn, false); showErr("eod-error", GPS_REQUIRED_MSG); return; }
    reverseGeocode(g, function (addr) {
      var mins = calcShiftMins(open.loginTime, logout);
      open.logoutTime = logout; open.durationMinutes = mins; open.durationText = formatDuration(mins);
      open.logoutGps = gpsToStr(g); open.logoutAddress = addr || "";
      open.activities = act; open.hasIssue = hasIssue; open.issueDetails = hasIssue ? issue : ""; open.tomorrowPlan = tom;
      open.status = "done"; open.pending = true; open.submittedAt = new Date().toISOString();
      persistLogs();

      confirmLog(open, "save");
      setVal("eod-activities", ""); setVal("eod-issues", ""); setVal("eod-tomorrow", "");
      setFlag("smooth");
      UI.busy = false; UI.eodFor = ""; setBtnBusy(btn, false);
      renderAll();
      showToast("Report submitted. Well done today!");
    });
  });
}

function setFlag(v) {

/* ---------- LEAVE ---------- */
function updateLeaveForm() {
  var f = val("lv-from"), t = val("lv-to");
  show("lv-half-wrap", !!f && f === t);
  if (!(f && f === t)) { var h = byId("lv-half"); if (h) h.checked = false; }
  setText("lv-reason-hint", val("lv-type") === "Other" ? "(required)" : "(optional)");
}

function submitLeave() {
  if (UI.busy) return;
  clearErr("lv-error"); clearFieldErrors(["lv-from", "lv-to", "lv-reason"]);
  var type = val("lv-type"), from = val("lv-from"), to = val("lv-to"), reason = val("lv-reason").trim();
  var half = !!(byId("lv-half") && byId("lv-half").checked) && from === to;
  if (!from || !to) { showErr("lv-error", "Please choose the dates.", byId(from ? "lv-to" : "lv-from")); return; }
  if (to < from) { showErr("lv-error", "The end date is before the start date.", byId("lv-to")); return; }
  if (type === "Other" && !reason) { showErr("lv-error", "Please give a reason.", byId("lv-reason")); return; }
  var span = Math.round((parseISO(to).getTime() - parseISO(from).getTime()) / 86400000);
  var item = { id: newId("LV"), name: SESSION.name, type: type, from: from, to: to, days: half ? 0.5 : span + 1, reason: reason, appliedAt: new Date().toISOString(), status: "Pending", adminNote: "", decidedAt: "", _pending: true };
  DATA.leaves.unshift(item);
  postMine({ action: "save_leave", leave: { id: item.id, employeeName: SESSION.name, type: type, from: from, to: to, half: half, reason: reason } });
  setVal("lv-reason", ""); setVal("lv-from", ""); setVal("lv-to", ""); updateLeaveForm();
  renderAll();
  confirmSave(function (cb) {
    execGet({ action: "myData", name: SESSION.name, pin: SESSION.pin }, function (d) {
      var ok = false;
      if (d && d.ok && d.valid && d.leaves) for (var i = 0; i < d.leaves.length; i++) if (d.leaves[i].id === item.id) ok = true;
      cb(ok);
    });
  }, function () { item._pending = false; loadMyData(); showToast("Request sent to your manager."); },
  function () { item._failed = true; renderAll(); showToast("⚠️ Not confirmed. Check your internet, then submit again."); });
}

function cancelLeave(id) {
  var l = null;
  for (var i = 0; i < DATA.leaves.length; i++) if (DATA.leaves[i].id === id) { l = DATA.leaves[i]; break; }
  if (!l || l.status !== "Pending") return;
  l.status = "Cancelled"; l._pending = true;
  postMine({ action: "cancel_leave", id: id, employeeName: SESSION.name });
  renderAll();
  confirmSave(function (cb) {
    execGet({ action: "myData", name: SESSION.name, pin: SESSION.pin }, function (d) {
      var ok = false;
      if (d && d.ok && d.valid && d.leaves) for (var j = 0; j < d.leaves.length; j++) if (d.leaves[j].id === id && d.leaves[j].status === "Cancelled") ok = true;
      cb(ok);
    });
  }, function () { l._pending = false; loadMyData(); showToast("Request cancelled."); },
  function () { showToast("⚠️ Could not cancel. It may already have been decided."); loadMyData(); });
}

function leaveStatusChip(s) { return '<span class="chip ' + (s === "Approved" ? "ok" : (s === "Rejected" ? "bad" : (s === "Cancelled" ? "" : "warn"))) + '">' + (s === "Approved" ? "✅ " : (s === "Rejected" ? "✖ " : (s === "Pending" ? "⏳ " : ""))) + escHtml(s) + "</span>"; }
function leaveRange(l) { return l.from === l.to ? prettyDate(l.from) : prettyDate(l.from) + " → " + prettyDate(l.to); }

function renderLeaves() {
  var box = byId("lv-list");

  var list = DATA.leaves.slice().sort(function (a, b) { return String(b.appliedAt).localeCompare(String(a.appliedAt)); });

    var l = list[i];
    h += '<div class="card" style="padding:14px;"><div class="pill-row" style="justify-content:space-between;"><strong>' + escHtml(l.type) + "</strong>" + leaveStatusChip(l.status) + "</div>" +
      '<p style="margin:6px 0 0;">' + escHtml(leaveRange(l)) + " · " + l.days + (l.days === 1 ? " day" : " days") + "</p>" +

/* ---------- TASKS (employee) ---------- */
function renderTasks() {
  var box = byId("tk-list");
  if (!box) return;
  var ae = document.activeElement;
  if (ae && box.contains(ae)) return;   /* don't wipe what someone is typing */
  var open = openTasks();
  var done = DATA.tasks.filter(function (t) { return t.status === "Done"; }).sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); }).slice(0, 8);
  var foot = '';
  if (!DATA.tasks.length) { box.innerHTML = '<div class="card"><p class="muted" style="margin:0;">No tasks assigned to you right now.</p></div>' + foot; return; }
  function card(t) {
    var d = UI.taskDraft[t.id] || {};
    var st = d.status || t.status;
    var cm = d.comment != null ? d.comment : t.comment;
    var statuses = [["Pending", ""], ["In Progress", "s-prog"], ["Blocked", "s-blocked"], ["Done", "s-done"]];
    var seg = "";
    for (var i = 0; i < statuses.length; i++) seg += '<button type="button" data-act="tk-status" data-id="' + escHtml(t.id) + '" data-val="' + statuses[i][0] + '" class="' + (st === statuses[i][0] ? "on " + statuses[i][1] : "") + '">' + statuses[i][0] + "</button>";
    return '<div class="task" data-task="' + escHtml(t.id) + '"><div class="top"><div class="ttl">' + (t.priority === "High" ? "🔥 " : "") + escHtml(t.title) + "</div>" + dueChip(t) + "</div>" +
      (t.details ? '<p class="muted" style="margin:6px 0 0;white-space:pre-wrap;">' + escHtml(t.details) + "</p>" : "") +
      '<div class="seg">' + seg + "</div>" +
      '<textarea data-comment="' + escHtml(t.id) + '" rows="2" placeholder="Add a comment (optional)">' + escHtml(cm) + "</textarea>" +
      '<div class="pill-row" style="margin-top:10px;"><button type="button" class="btn btn-dark btn-sm" data-act="tk-save" data-id="' + escHtml(t.id) + '"><span>Save update</span></button>' +
      (t._pending ? '<span class="chip warn">⏳ saving</span>' : (t.updatedAt ? '<span class="muted">Last updated ' + escHtml(new Date(t.updatedAt).toLocaleString()) + "</span>" : "")) + "</div></div>";
  }
  var h = "";
  if (open.length) { for (var i = 0; i < open.length; i++) h += card(open[i]); }
  else h += '<div class="note ok">🎉 Nothing pending. All tasks are done.</div>';
  if (done.length) { h += '<h3 class="section">Completed</h3>'; for (var j = 0; j < done.length; j++) h += card(done[j]); }
  box.innerHTML = h + foot;
}

function saveTask(id) {
  var t = null;
  for (var i = 0; i < DATA.tasks.length; i++) if (DATA.tasks[i].id === id) { t = DATA.tasks[i]; break; }
  if (!t) return;
  var d = UI.taskDraft[id] || {};
  var ta = document.querySelector('[data-comment="' + id + '"]');
  var status = d.status || t.status;
  var comment = ta ? ta.value.trim() : (d.comment != null ? d.comment : t.comment);
  var stamp = new Date().toISOString();
  t.status = status; t.comment = comment; t.updatedAt = stamp; t._pending = true;
  delete UI.taskDraft[id];
  postMine({ action: "update_task", id: id, status: status, comment: comment, updatedAt: stamp, employeeName: SESSION.name });
  var ae = document.activeElement; if (ae && ae.blur) ae.blur();
  renderAll();
  confirmSave(function (cb) {
    execGet({ action: "myData", name: SESSION.name, pin: SESSION.pin }, function (r) {
      var ok = false;
      if (r && r.ok && r.valid && r.tasks) for (var j = 0; j < r.tasks.length; j++) if (r.tasks[j].id === id && r.tasks[j].updatedAt === stamp) ok = true;
      cb(ok);
    });
  }, function () { t._pending = false; renderAll(); showToast("Task updated."); },
  function () { showToast("⚠️ Not confirmed in the sheet. Check your internet and save again."); });
}

/* ---------- VISITS + EXPENSES (employee) ---------- */
function myField(list) {
  var out = [], t = todayISO();
  for (var i = 0; i < list.length; i++) if (sameName(list[i].employeeName, SESSION.name) && list[i].date === t) out.push(list[i]);
  return out;
}
function fieldChip(item) {
  if (item.status === "saved") return '<span class="fw-chip ok">✓ Saved</span>';
  if (item.status === "failed") return '<span class="fw-chip warn">⚠️ Not saved</span> <button type="button" class="preset-btn" data-act="fw-retry" data-id="' + escHtml(item.id) + '">Retry</button>';

function addExpense() {

  var cat = val("xp-cat"), amount = parseFloat(val("xp-amt")), desc = normalizeSpaces(val("xp-desc")), site = normalizeSpaces(val("xp-site")), date = val("xp-date") || todayISO();

function fwRetry(id) {
  var item = null, kind = "";
  for (var i = 0; i < FIELD.visits.length; i++) if (FIELD.visits[i].id === id) { item = FIELD.visits[i]; kind = "visit"; }

  if (kind === "visit") postMine({ action: "save_visit", visit: visitPayload(item) });

  renderAll();
  confirmField(kind, item, "Saved.");
}

    if (placeText(l.logoutAddress, "")) lines.push("   • 📍 Logout: " + placeText(l.logoutAddress, "") + (mapUrl(l.logoutGps) ? " " + mapUrl(l.logoutGps) : ""));

function buildCsv(items) {

  for (var i = 0; i < items.length; i++) {
    var l = items[i];
    var dur = l.durationText || formatDuration(l.durationMinutes || calcShiftMins(l.loginTime, l.logoutTime));

              var val = cell, st = 0;

              if (val === null || val === undefined || val === "") continue;
              var ref = colLetter(c) + (r + 1);
              if (typeof val === "number" && isFinite(val)) x += '<c r="' + ref + '" s="' + st + '"><v>' + val + "</v></c>";
              else x += '<c r="' + ref + '" s="' + st + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(val) + "</t></is></c>";
            }
            x += "</row>";
          }
          x += "</sheetData></worksheet>";
          files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", text: x });
        }
        ct += "</Types>";
        wb += "</sheets></workbook>";
        rels += '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
        var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
        var pkgRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
        files.unshift({ name: "xl/styles.xml", text: styles });
        files.unshift({ name: "xl/_rels/workbook.xml.rels", text: rels });
        files.unshift({ name: "xl/workbook.xml", text: wb });
        files.unshift({ name: "_rels/.rels", text: pkgRels });
        files.unshift({ name: "[Content_Types].xml", text: ct });
        return zipStore(files);
      }

      function saveBlob(blob, filename) {
        try {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);
          showToast("Downloaded " + filename);
        } catch (e) {
          showToast("Download is not available in this browser.");
        }
      }

      function shareBlob(blob, filename) {
        try {
          var file = new File([blob], filename, { type: blob.type });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: filename }).catch(function (err) {
              if (!err || err.name !== "AbortError") saveBlob(blob, filename);
            });
            return;
          }
        } catch (e) {}
        saveBlob(blob, filename);
      }

      function canShareFiles() {
        try {
          var f = new File(["x"], "t.xlsx", { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          return !!(navigator.canShare && navigator.canShare({ files: [f] }));
        } catch (e) { return false; }
      }

      function expenseWorkbook() {
        var v = expenseView();
        var range = (v.r.from ? prettyDate(v.r.from) : "start") + " to " + (v.r.to ? prettyDate(v.r.to) : "today");
        var sum = [
          [{ v: "Energy 360 Technologies - Expense Summary", b: true }],
          ["Period: " + range + (v.r.emp ? " | Employee: " + v.r.emp : "") + (v.r.cat ? " | Category: " + v.r.cat : "")],
          [],
          [{ v: "By employee", b: true }],
          [{ v: "Employee", b: true }, { v: "Entries", b: true }, { v: "Total (INR)", b: true }]
        ];
        var en = sortedKeys(v.byEmp);
        for (var i = 0; i < en.length; i++) sum.push([en[i], v.byEmp[en[i]].n, { v: Math.round(v.byEmp[en[i]].sum * 100) / 100, m: true }]);
        sum.push([{ v: "Grand total", b: true }, v.list.length, { v: Math.round(v.total * 100) / 100, m: true }]);
        sum.push([]);
        sum.push([{ v: "By category", b: true }]);
        sum.push([{ v: "Category", b: true }, { v: "Entries", b: true }, { v: "Total (INR)", b: true }]);
        var cn = sortedKeys(v.byCat);
        for (var c = 0; c < cn.length; c++) sum.push([cn[c], v.byCat[cn[c]].n, { v: Math.round(v.byCat[cn[c]].sum * 100) / 100, m: true }]);
        var det = [[{ v: "Date", b: true }, { v: "Employee", b: true }, { v: "Category", b: true }, { v: "Amount (INR)", b: true }, { v: "Description", b: true }, { v: "Site", b: true }, { v: "Status", b: true }, { v: "Submitted At", b: true }]];
        var asc = v.list.slice().reverse();
        for (var d = 0; d < asc.length; d++) {
          var x = asc[d];
          det.push([x.date, x.name, x.category, { v: x.amount, m: true }, x.description, x.site, x.status || "Submitted", x.serverTime]);
        }
        return makeXlsx([
          { name: "Summary", rows: sum, widths: [28, 10, 16] },
          { name: "Expenses", rows: det, widths: [12, 20, 20, 14, 36, 24, 12, 26] }
        ]);
      }

      function visitWorkbook() {
        var v = visitView();
        var range = (v.r.from ? prettyDate(v.r.from) : "start") + " to " + (v.r.to ? prettyDate(v.r.to) : "today");
        var sum = [
          [{ v: "Energy 360 Technologies - Site Visit Summary", b: true }],
          ["Period: " + range + (v.r.emp ? " | Employee: " + v.r.emp : "")],
          [],
          [{ v: "Employee", b: true }, { v: "Check-ins", b: true }, { v: "Distinct sites", b: true }, { v: "Days active", b: true }]
        ];
        var names = sortedKeys(v.byEmp);
        for (var i = 0; i < names.length; i++) {
          var e = v.byEmp[names[i]];
          sum.push([names[i], e.n, Object.keys(e.sites).length, Object.keys(e.days).length]);
        }
        sum.push([{ v: "Total", b: true }, v.list.length, v.siteCount, ""]);
        var det = [[{ v: "Date", b: true }, { v: "Employee", b: true }, { v: "Phone Time", b: true }, { v: "Server Time", b: true }, { v: "Site", b: true }, { v: "Purpose", b: true }, { v: "Address", b: true }, { v: "Accuracy (m)", b: true }, { v: "Map Link", b: true }]];
        var asc = v.list.slice().reverse();
        for (var d = 0; d < asc.length; d++) {
          var x = asc[d];
          var acc = Number(x.accuracy);
          det.push([x.date, x.name, x.time, x.serverTime, x.site, x.purpose, x.address, (isFinite(acc) && x.accuracy !== "") ? acc : "", mapUrl(x.gps)]);
        }
        return makeXlsx([
          { name: "Summary", rows: sum, widths: [26, 12, 16, 14] },
          { name: "Check-ins", rows: det, widths: [12, 20, 12, 26, 26, 28, 50, 12, 46] }
        ]);
      }

      function csvOf(headers, rows) {
        function cell(v) { return '"' + String(v == null ? "" : v).split('"').join('""') + '"'; }
        var out = [headers.map(cell).join(",")];
        for (var i = 0; i < rows.length; i++) out.push(rows[i].map(cell).join(","));
        return "﻿" + out.join("\n");
      }

      function exportReport(kind, how) {
        if (!FIELD_REPORT.loaded) { showToast("Load the data first (tap Refresh)."); return; }
        var stamp = todayISO();
        if (kind === "expenses") {
          var ev = expenseView();
          if (ev.list.length === 0) { showToast("Nothing to export in this range."); return; }
          if (how === "csv") {
            downloadSafe(csvOf(["Date", "Employee", "Category", "Amount", "Description", "Site", "Status", "Submitted At"], ev.list.map(function (x) { return [x.date, x.name, x.category, x.amount, x.description, x.site, x.status, x.serverTime]; })), "expenses-" + stamp + ".csv", "text/csv;charset=utf-8", "expenses.csv");
            return;
          }
          var eb = expenseWorkbook();
          if (how === "share") shareBlob(eb, "expenses-" + stamp + ".xlsx"); else saveBlob(eb, "expenses-" + stamp + ".xlsx");
        } else {
          var vv = visitView();
          if (vv.list.length === 0) { showToast("Nothing to export in this range."); return; }
          if (how === "csv") {
            downloadSafe(csvOf(["Date", "Employee", "Phone Time", "Server Time", "Site", "Purpose", "Address", "Accuracy (m)", "Map Link", "GPS"], vv.list.map(function (x) { return [x.date, x.name, x.time, x.serverTime, x.site, x.purpose, x.address, x.accuracy, mapUrl(x.gps), x.gps]; })), "site-visits-" + stamp + ".csv", "text/csv;charset=utf-8", "site-visits.csv");
            return;
          }
          var vb = visitWorkbook();
          if (how === "share") shareBlob(vb, "site-visits-" + stamp + ".xlsx"); else saveBlob(vb, "site-visits-" + stamp + ".xlsx");
        }
      }



/* =================================================================== */
/* EVENTS + BOOT                                                       */
/* =================================================================== */
function on(id, evt, fn) { var e = byId(id); if (e) e["on" + evt] = fn; }

function bindPanelEvents() {
  var t = todayISO();
  if (!IS_ADMIN) {
    var lf = byId("lv-from"); if (lf) { var d = new Date(); d.setDate(d.getDate() - 30); lf.min = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
    var lt = byId("lv-to"); if (lt) lt.min = t;
    var xd = byId("xp-date"); if (xd) xd.max = t;
    if (CAN_ASSIGN) { on("at-f-emp", "change", renderAdminTasks); on("at-f-status", "change", renderAdminTasks); }
    return;
  }
  var refresh = function () { FIELD_REPORT.loaded = false; loadFieldReport(); renderExpensesReport(); renderVisitsReport(); };
  on("btn-ex-refresh", "click", refresh); on("btn-vs-refresh", "click", refresh);
  function bindX(id, kind, how) { on(id, "click", function () { exportReport(kind, how); }); }
  bindX("btn-ex-xlsx", "expenses", "xlsx"); bindX("btn-ex-share", "expenses", "share"); bindX("btn-ex-csv", "expenses", "csv");
  bindX("btn-vs-xlsx", "visits", "xlsx"); bindX("btn-vs-share", "visits", "share"); bindX("btn-vs-csv", "visits", "csv");
  if (canShareFiles()) { var a = byId("btn-ex-share"); if (a) a.style.display = ""; var b = byId("btn-vs-share"); if (b) b.style.display = ""; }
  var ids = ["ex-from", "ex-to", "ex-emp", "ex-cat"];
  for (var i = 0; i < ids.length; i++) on(ids[i], "change", renderExpensesReport);
  var ids2 = ["vs-from", "vs-to", "vs-emp"];
  for (var j = 0; j < ids2.length; j++) on(ids2[j], "change", renderVisitsReport);
  on("ah-date", "change", renderAdminHome);
  on("ah-search", "input", renderAdminHome);
  on("at-f-emp", "change", renderAdminTasks); on("at-f-status", "change", renderAdminTasks);
  on("al-f-emp", "change", renderAdminLeaves); on("al-f-status", "change", renderAdminLeaves);
}

function onClick(e) {
  var rp = e.target.closest ? e.target.closest("[data-rep-preset]") : null;
  if (rp) { applyPreset(rp.getAttribute("data-rep-preset")); return; }
  var n = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!n) return;
  var act = n.getAttribute("data-act"), id = n.getAttribute("data-id");
  switch (act) {
    case "login": doLogin(); break;
    case "login-switch": setLoginMode(n.getAttribute("data-admin") !== "1"); show("lg-error", false); break;
    case "signout": signOut(); break;
    case "refresh": pullFromSheet(); refreshData(); showToast("Refreshing…"); break;
    case "tab": showTab(n.getAttribute("data-tab")); break;
    case "close-modal": closeModal(); break;
    case "mode-switch": switchMode(); break;
    case "goto-tasks": showTab("tasks"); break;
    case "punch-in": punchIn(); break;
    case "submit-eod": submitEod(); break;
    case "flag": setFlag(n.getAttribute("data-val")); break;
    case "open-manual": openManual(); break;
    case "manual-save": saveManual(); break;
    case "new-shift": UI.forcePunch = true; renderHome(); break;
    case "edit-log": openEdit(id); break;
    case "edit-save": saveEdit(); break;
    case "lv-submit": submitLeave(); break;
    case "lv-cancel": cancelLeave(id); break;
    case "tk-status":
      var d = UI.taskDraft[id] || {}; d.status = n.getAttribute("data-val"); UI.taskDraft[id] = d;
      var sibs = n.parentNode.querySelectorAll("button");
      for (var s = 0; s < sibs.length; s++) sibs[s].className = "";
      n.className = "on " + (d.status === "Done" ? "s-done" : (d.status === "Blocked" ? "s-blocked" : (d.status === "In Progress" ? "s-prog" : "")));
      break;
    case "tk-save": saveTask(id); break;
    case "checkin": checkIn(); break;
    case "expense": addExpense(); break;
    case "fw-retry": fwRetry(id); break;
    case "ah-all": UI.ahAll = !UI.ahAll; renderAdminHome(); break;
    case "ah-issues": UI.ahIssues = !UI.ahIssues; renderAdminHome(); break;
    case "ah-copy": var sm = buildSummary(); if (sm) copyText(sm); else showToast("No reports to copy."); break;
    case "ah-csv": var rows = ahLogs(); if (rows.length) downloadSafe(buildCsv(rows), "eod-reports-" + todayISO() + ".csv", "text/csv;charset=utf-8"); else showToast("No reports to download."); break;
    case "at-pick": var nm = n.getAttribute("data-name"); if (UI.assignees[nm]) delete UI.assignees[nm]; else UI.assignees[nm] = true; renderAdminTasks(); break;
    case "at-all": if (Object.keys(UI.assignees).length === STAFF.length) UI.assignees = {}; else { UI.assignees = {}; for (var q = 0; q < STAFF.length; q++) UI.assignees[STAFF[q]] = true; } renderAdminTasks(); break;
    case "assign": assignTask(); break;
    case "at-del": deleteTask(id); break;
    case "decide": decideLeave(id, n.getAttribute("data-dec")); break;
    case "al-xlsx": if (!DATA.leaves.length) showToast("Nothing to export."); else saveBlob(leavesWorkbook(), "leaves-" + todayISO() + ".xlsx"); break;
    case "staff-add": addStaff(); break;
    case "staff-del": removeStaff(n.getAttribute("data-name")); break;
    case "pin-set": openSetPin(n.getAttribute("data-name")); break;
    case "pin-save": savePinFor(n.getAttribute("data-name")); break;
    case "gen-pins": generatePins(); break;
    case "copy-pins": copyText(n.getAttribute("data-text")); break;
  }
}

function onInput(e) {
  var t = e.target;
  if (!t) return;
  if (t.id === "eod-logout") { var o = findOpenPunch(SESSION.name); updateDuration(o); }
  if (t.getAttribute && t.getAttribute("data-comment")) {
    var id = t.getAttribute("data-comment");
    var d = UI.taskDraft[id] || {}; d.comment = t.value; UI.taskDraft[id] = d;
  }
  if (t.id === "lv-from") { var to = byId("lv-to"); if (to && (!to.value || to.value < t.value)) to.value = t.value; if (to) to.min = t.value; updateLeaveForm(); }
  if (t.id === "lv-to" || t.id === "lv-type") updateLeaveForm();
  if (t.id === "lg-pin") t.value = t.value.replace(/[^0-9]/g, "");
  if (t.id === "sp-pin") t.value = t.value.replace(/[^0-9]/g, "");
  if (t.classList && t.classList.contains("has-error")) t.classList.remove("has-error");
}

function tick() {
  var c = byId("punch-clock");
  if (c) c.textContent = "🕘 " + prettyTime12(nowHHMM());
  var day = todayISO();
  if (UI.day && UI.day !== day) { UI.day = day; if (SESSION) { UI.forcePunch = false; renderAll(); } }
  UI.day = day;
}

function boot() {
  loadLocal();
  UI.day = todayISO();
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onInput);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.target.id === "lg-pin" || e.target.id === "lg-code")) doLogin();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && SESSION) { pullFromSheet(); refreshData(); tick(); } });
  setInterval(tick, 20000);

  var q = (window.location.search || "") + (window.location.hash || "");
  if (/[?&#]admin=0/.test(q)) { SafeStorage.set(KEYS.ADMIN_FLAG, "0"); SafeStorage.set(KEYS.ADMIN_CODE, ""); }
  var wantsAdmin = /[?&#]admin=1/.test(q);
  var storedAdmin = SafeStorage.get(KEYS.ADMIN_FLAG) === "1" && !!getAdminCode();

  if (storedAdmin) {
    startAdmin();
    execGet({ action: "verifyAdmin", code: getAdminCode() }, function (d) {
      if (d && d.ok && d.admin !== true) { SafeStorage.set(KEYS.ADMIN_FLAG, "0"); SafeStorage.set(KEYS.ADMIN_CODE, ""); showLogin((d.message || "Admin sign-in expired.") + " Please sign in again.", true); }
    });
    return;
  }
  if (wantsAdmin) { showLogin("", true); pullFromSheet(); return; }
  var m = loadSession();
  if (m) {
    startEmployee(m.name, m.pin);
    execGet({ action: "verifyPin", name: m.name, pin: m.pin }, function (d) {
      if (d && d.ok && d.valid === false) sessionExpired(d.message || "Please sign in again.");
    });
    return;
  }
  showLogin("", false);
  pullFromSheet();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
