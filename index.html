<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Energy360 Technologies — Solar Operations Tracker</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Energy360" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    if (window.tailwind) tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: { slate: { 850: '#172033', 900: '#0f172a', 950: '#090d16' } }
      } }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24 md:pb-10 selection:bg-amber-200 selection:text-slate-900">

  <div id="toastContainer" class="fixed top-4 right-4 left-4 md:left-auto md:w-96 z-[60] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Login (team access code) -->
  <div id="loginScreen" class="hidden fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
    <form onsubmit="handleLogin(event)" class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl">
      <div class="text-center space-y-2">
        <img data-logo alt="Energy360 Technologies" class="h-24 mx-auto" />
        <p class="text-xs text-slate-500">Sign in to the Energy360 project tracker</p>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-700 block mb-1">Team access code</label>
        <input id="loginCode" required autocomplete="off" placeholder="e.g. E360-4F2A9C" class="w-full px-3.5 py-3 rounded-xl border border-slate-300 font-mono tracking-wider focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-700 block mb-1">Your name</label>
        <input id="loginName" required placeholder="e.g. Rajesh Sharma" class="w-full px-3.5 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-amber-500" />
      </div>
      <p id="loginError" class="hidden text-xs font-semibold text-rose-600"></p>
      <button id="loginBtn" type="submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold text-sm">Sign in</button>
      <p class="text-[11px] text-slate-400 text-center">Ask your manager for the team access code.</p>
    </form>
  </div>

  <!-- Top Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 cursor-pointer min-w-0" onclick="switchTab('dashboard')">
        <div class="bg-white rounded-xl px-2 py-1 shadow-md shrink-0">
          <img data-logo alt="Energy360 Technologies" class="h-10 sm:h-11 w-auto block" />
        </div>
        <div class="min-w-0">
          <h1 class="hidden sm:block font-bold text-base tracking-tight leading-none">Energy360 <span class="text-lime-400">Technologies</span></h1>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 sm:mt-1 rounded-full text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
            <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            <span id="syncText">Connecting…</span>
          </span>
          <p class="text-[11px] text-slate-400 mt-0.5 hidden sm:block truncate">Live on Google Sheets · <span id="whoAmI"></span></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openQuickEodModal()" class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white text-xs sm:text-sm font-semibold flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span>Daily EOD</span>
        </button>
        <button onclick="refreshData(false)" title="Refresh from Google Sheets" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 border border-slate-700">
          <svg id="syncSpinner" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button onclick="switchTab('admin')" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-amber-400 border border-slate-700" title="Manager settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <nav class="hidden md:block bg-slate-850 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-6 flex items-center gap-1 overflow-x-auto py-1.5" id="desktopNav"></div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 pt-5 space-y-6" id="appRoot">
    <div class="text-center text-sm text-slate-500 py-16">Loading your projects from Google Sheets…</div>
  </main>

  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 z-30 px-1 py-1.5 shadow-2xl">
    <div class="grid grid-cols-7 gap-0.5 text-center" id="mobileNav"></div>
  </nav>

  <!-- Project 360° -->
  <div id="project360Modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-40 hidden flex items-end md:items-center justify-center p-0 md:p-4">
    <div class="bg-white w-full max-w-3xl rounded-t-3xl md:rounded-2xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400">Unified Project 360° View</span>
          <h3 id="p360Title" class="text-lg font-bold"></h3>
        </div>
        <button onclick="closeModal('project360Modal')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="p360Body" class="p-5 overflow-y-auto space-y-5 text-sm"></div>
    </div>
  </div>

  <!-- Generic form modal -->
  <div id="formModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-40 hidden flex items-end md:items-center justify-center p-0 md:p-4">
    <div class="bg-white w-full max-w-xl rounded-t-3xl md:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 id="formModalTitle" class="text-base sm:text-lg font-bold">Edit Record</h3>
        <button onclick="closeModal('formModal')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="dynamicForm" onsubmit="handleFormSubmit(event)" class="p-5 overflow-y-auto space-y-4"></form>
    </div>
  </div>

const SESSION_KEY = 'heliogrid_session_v2';
const CACHE_KEY = 'heliogrid_cache_v2';
const DEPTS = ['Site Engineering', 'DISCOM Liaison', 'Lead Management', 'Banking', 'Marketing', 'Office Admin', 'HR'];
const EMPTY = { staff: [], leads: [], execution: [], discom: [], inventory: [], payments: [], eodLogs: [] };

let session = readStore(SESSION_KEY) || { code: '', user: '' };
let appState = Object.assign({}, EMPTY, readStore(CACHE_KEY) || {});
let sheetUrl = '';
let lastSynced = null;
let currentTab = 'dashboard';
let adminPin = '';            // held in memory only after the server accepts it
let currentModalContext = null;
let busy = false;

let leadFilterStatus = 'All';
let searchQuery = '';
let eodFilterDate = '';
let eodFilterDept = 'All';

function readStore(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: fine */ } }

// --- 2. SERVER BRIDGE ---
// Your Apps Script web-app link. Used when this page is hosted outside Google (GitHub Pages).
const API_URL = 'https://script.google.com/macros/s/AKfycbzBmbp6VEhyLyE4V60kEYfMleANHM55lKp9dolIM2EBiwSh7Slh1rdAy1X_t8MTjZ49/exec';
const IN_APPS_SCRIPT = !!(window.google && google.script && google.script.run);

function handleReply(res, resolve, reject) {
  if (res && res.ok) return resolve(res);
  const msg = (res && res.error) || 'Unknown server error';
  if (msg.indexOf('AUTH:') === 0) showLogin(msg.replace('AUTH: ', ''));
  reject(new Error(msg.replace('AUTH: ', '')));
}

function server(action, payload) {
  const req = Object.assign({ action, code: session.code, user: session.user }, payload || {});
  return new Promise((resolve, reject) => {
    if (IN_APPS_SCRIPT) {
      google.script.run
        .withSuccessHandler(res => handleReply(res, resolve, reject))
        .withFailureHandler(err => reject(new Error((err && err.message) || 'Network error — check your connection.')))
        .api(req);
      return;
    }
    // text/plain keeps this a "simple" request, so the browser sends it straight to Google with no CORS pre-check.
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow', signal: ctrl.signal })
      .then(r => r.text())
      .then(text => {
        let res;
        try { res = JSON.parse(text); }
        catch (e) { throw new Error('The server sent an unexpected reply. Check the Apps Script deployment is set to "Anyone" and has been redeployed.'); }
        handleReply(res, resolve, reject);
      })
      .catch(err => reject(new Error(err.name === 'AbortError' ? 'The server took too long — check your connection and try again.' : (err.message && err.message !== 'Failed to fetch' ? err.message : 'No connection to the server — check your internet.'))))
      .finally(() => clearTimeout(timer));
  });
}

function applyServerData(res) {
  if (res.data) {
    appState = Object.assign({}, EMPTY, res.data);
    writeStore(CACHE_KEY, appState);
  }
  if (res.sheetUrl) sheetUrl = res.sheetUrl;
  lastSynced = new Date();
  updateSyncBadge('ok');
}

async function refreshData(silent = true) {
  if (!session.code) return;
  const spinner = document.getElementById('syncSpinner');
  spinner.classList.add('animate-spin');
  try {
    applyServerData(await server('getAll'));
    renderCurrentTab();
    if (!silent) showToast('Up to date with Google Sheets.');
  } catch (err) {
    updateSyncBadge('error');
    if (!silent) showToast(err.message, 'error');
  } finally {
    spinner.classList.remove('animate-spin');
  }
}

/** Save one record. Returns the record key, or null on failure (the form stays open). */
async function saveRecord(table, record, extra) {
  updateSyncBadge('saving');
  try {
    const res = await server('save', Object.assign({ table, record }, extra || {}));
    applyServerData(res);
    return res.key;
  } catch (err) {
    updateSyncBadge('error');
    showToast('Not saved: ' + err.message, 'error');
    return null;
  }
}

// --- 3. LOGIN ---
function showLogin(errorMsg) {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginCode').value = session.code || '';
  document.getElementById('loginName').value = session.user || '';
  const e = document.getElementById('loginError');
  e.textContent = errorMsg || '';
  e.classList.toggle('hidden', !errorMsg);
}

async function handleLogin(ev) {
  ev.preventDefault();
  const btn = document.getElementById('loginBtn');
  const code = document.getElementById('loginCode').value.trim();
  const user = document.getElementById('loginName').value.trim();
  session = { code, user };
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const res = await server('getAll');
    writeStore(SESSION_KEY, session);
    applyServerData(res);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('whoAmI').textContent = session.user;
    renderNav(); renderCurrentTab();
    showToast('Welcome, ' + user.split(' ')[0] + '!');
  } catch (err) {
    showLogin(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

function signOut() {
  session = { code: '', user: '' };
  writeStore(SESSION_KEY, session);
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  appState = Object.assign({}, EMPTY);
  adminPin = '';
  showLogin();
}

// --- 4. HELPERS ---
function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/** Safe argument for inline onclick="fn(...)". */
function js(v) { return esc(JSON.stringify(String(v === null || v === undefined ? '' : v))); }
function opts(list, current) { return list.map(o => `<option ${String(current) === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join(''); }

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1];
  return `${Number(m[3])} ${mon} ${m[1]}`;
}
function formatINR(num) { return '₹' + (Number(num) || 0).toLocaleString('en-IN'); }
function formatINRCompact(num) {
  const n = Number(num) || 0;
  if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2) + ' Cr';
  if (n >= 100000) return '₹' + (n / 100000).toFixed(2) + ' L';
  return '₹' + n.toLocaleString('en-IN');
}
function received(p) { return (Number(p.advancePaid) || 0) + (Number(p.preDispatchPaid) || 0) + (Number(p.postInstallPaid) || 0) + (Number(p.finalPaid) || 0); }
function isOverdue(exec) { return !exec.actualCommissioning && exec.targetHandover && exec.targetHandover < todayISO(); }

function calcExecutionProgress(exec) {
  let score = 0;
  if (exec.materialDispatch === 'Dispatched') score += 10;
  if (exec.materialDispatch === 'Delivered') score += 20;
  if (exec.structureStatus === 'In Progress') score += 12;
  if (exec.structureStatus === 'Done') score += 25;
  if (exec.moduleInverterStatus === 'In Progress') score += 12;
  if (exec.moduleInverterStatus === 'Done') score += 25;
  if (exec.cablingEarthingStatus === 'In Progress') score += 10;
  if (exec.cablingEarthingStatus === 'Done') score += 20;
  if (exec.qcSignoff === 'Passed') score += 10;
  return Math.min(100, score);
}

function getStatusBadge(status) {
  const green = 'bg-emerald-50 text-emerald-700 border-emerald-200', amber = 'bg-amber-50 text-amber-700 border-amber-200',
        blue = 'bg-blue-50 text-blue-700 border-blue-200', indigo = 'bg-indigo-50 text-indigo-700 border-indigo-200',
        grey = 'bg-slate-100 text-slate-700 border-slate-200', rose = 'bg-rose-50 text-rose-700 border-rose-200';
  const map = {
    'New': grey, 'Survey Done': blue, 'Quote Sent': indigo, 'Negotiation': amber, 'Won': green, 'Lost': rose,
    'Pending': amber, 'In Progress': blue, 'Dispatched': indigo, 'Delivered': green, 'Done': green, 'Passed': green,
    'Approved': green, 'Paid': green, 'Installed': green, 'Yes': green, 'No': 'bg-slate-100 text-slate-600 border-slate-200',
    'Required': rose, 'Completed': green, 'Disbursed': green, 'Sanctioned': blue, 'Loan Applied': amber,
    'Self-Funded': grey, 'N/A': 'bg-slate-100 text-slate-500 border-slate-200', 'Overdue': rose
  };
  const s = status || 'Pending';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${map[s] || grey}">${esc(s)}</span>`;
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const bg = type === 'error' ? 'bg-rose-600 text-white' : type === 'info' ? 'bg-slate-800 text-white' : 'bg-emerald-600 text-white';
  toast.className = `${bg} px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center justify-between gap-3 pointer-events-auto transition-all duration-300`;
  const span = document.createElement('span'); span.textContent = message;
  const btn = document.createElement('button'); btn.textContent = '✕'; btn.className = 'opacity-75 hover:opacity-100 font-bold'; btn.onclick = () => toast.remove();
  toast.append(span, btn);
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, type === 'error' ? 6000 : 3500);
}

function updateSyncBadge(state) {
  const dot = document.getElementById('syncDot'), txt = document.getElementById('syncText');
  if (state === 'saving') { dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse'; txt.textContent = 'Saving…'; return; }
  if (state === 'error') { dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500'; txt.textContent = 'Offline'; return; }
  dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
  txt.textContent = lastSynced ? 'Synced ' + lastSynced.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : 'Live';
}

function setBusy(form, on, label) {
  busy = on;
  const btn = form && form.querySelector('button[type=submit]');
  if (btn) { btn.disabled = on; if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Saving…'; } else if (btn.dataset.label) btn.textContent = btn.dataset.label; }
}

// --- 5. INTERLINKING: LEAD → PROJECT (done on the server so IDs never clash) ---
async function convertLeadToProject(leadId) {
  const lead = appState.leads.find(l => l.leadId === leadId);
  if (!lead) return;
  if (lead.projectId) { showToast(`Already linked to ${lead.projectId}`, 'info'); openProject360(lead.projectId); return; }
  updateSyncBadge('saving');
  try {
    const res = await server('convertLead', { leadId });
    applyServerData(res);
    renderCurrentTab();
    showToast(`🎉 ${leadId} is now project ${res.key} — linked across Execution, DISCOM & Payments.`);
  } catch (err) {
    updateSyncBadge('error');
    showToast('Could not convert: ' + err.message, 'error');
  }
}

function renderNav() {
  document.getElementById('desktopNav').innerHTML = TABS.map(t => `
    <button onclick="switchTab('${t.id}')" class="px-3.5 py-2 rounded-xl text-sm font-medium flex items-center gap-2 transition whitespace-nowrap ${currentTab === t.id ? 'bg-amber-500 text-slate-950 font-semibold shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800'}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${t.icon}</svg><span>${t.label}</span>
    </button>`).join('');
  document.getElementById('mobileNav').innerHTML = TABS.map(t => `
    <button onclick="switchTab('${t.id}')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${currentTab === t.id ? 'text-amber-400 font-semibold' : 'text-slate-400 hover:text-slate-200'}">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${t.icon}</svg>
      <span class="text-[10px] leading-tight">${t.short}</span>
    </button>`).join('');
}

function switchTab(tabId) {
  currentTab = tabId;
  searchQuery = '';
  renderNav();
  renderCurrentTab();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCurrentTab() {
  const views = { dashboard: renderDashboard, leads: renderLeads, execution: renderExecution, discom: renderDiscom,
                  inventory: renderInventory, payments: renderPayments, eod: renderEod, admin: renderAdmin };
  document.getElementById('appRoot').innerHTML = (views[currentTab] || renderDashboard)();
}

async function unlockAdmin(e) {
  e.preventDefault();
  const pin = document.getElementById('pinInput').value.trim();
  try { await server('verifyPin', { pin }); adminPin = pin; renderCurrentTab(); }
  catch (err) { showToast(err.message, 'error'); }
}

async function addStaffMember(e) {
  e.preventDefault();
  const name = document.getElementById('newStaffName').value.trim();
  const dept = document.getElementById('newStaffDept').value;
  if (!name) return;
  setBusy(e.target, true);
  const key = await saveRecord('staff', { name, dept }, { pin: adminPin });
  setBusy(e.target, false);
  if (key) { renderCurrentTab(); showToast(`Added ${name} (${dept})`); }
}

async function removeStaff(id) {
  const s = appState.staff.find(x => x.id === id);
  if (!s || !confirm(`Remove ${s.name} from the staff list? Their past EOD logs stay.`)) return;
  try { applyServerData(await server('remove', { table: 'staff', key: id, pin: adminPin })); renderCurrentTab(); showToast('Removed ' + s.name); }
  catch (err) { showToast(err.message, 'error'); }
}

async function updateSecrets(e) {
  e.preventDefault();
  const newPin = document.getElementById('newPinInput').value.trim();
  const newCode = document.getElementById('newCodeInput').value.trim();
  if (!newPin && !newCode) return showToast('Enter a new PIN or team code.', 'info');
  try {
    await server('updateSecrets', { pin: adminPin, newPin, newCode });
    if (newPin) adminPin = newPin;
    if (newCode) { session.code = newCode; writeStore(SESSION_KEY, session); }
    renderCurrentTab();
    showToast('Saved.' + (newCode ? ' Share the new team code with your staff.' : ''));
  } catch (err) { showToast(err.message, 'error'); }
}

        <div><span class="text-slate-400 block">Collected</span><strong class="text-emerald-600">${formatINR(got)}</strong></div>
        <div><span class="text-slate-400 block">Balance Due</span><strong class="text-rose-600">${formatINR(pending)}</strong></div>

    </div>
    <div class="space-y-2">
      <span class="text-xs font-bold uppercase text-slate-400 block">5. Linked Staff Field Logs (${logs.length})</span>
      ${logs.length === 0 ? `<p class="text-xs text-slate-400">No EOD logs tagged to ${esc(projectId)} yet.</p>` : logs.map(l => `
        <div class="p-3 rounded-xl border border-slate-200 text-xs">
          <div class="flex justify-between font-bold text-slate-800 mb-1"><span>${esc(l.staffName)} (${esc(l.dept)})</span><span class="text-slate-400 font-normal">${fmtDate(l.date)}</span></div>

  document.getElementById('project360Modal').classList.remove('hidden');
}

// --- 16. FORMS ---
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function openForm(title, ctx, html) {
  currentModalContext = ctx;
  document.getElementById('formModalTitle').textContent = title;
  document.getElementById('dynamicForm').innerHTML = html;
  document.getElementById('formModal').classList.remove('hidden');
}
const inputCls = 'w-full px-3 py-2.5 rounded-xl border border-slate-300';
function field(label, inner, wide) { return `<div class="${wide ? 'sm:col-span-2' : ''}"><label class="font-semibold text-slate-700 block mb-1">${label}</label>${inner}</div>`; }
function input(name, value, attrs) { return `<input name="${name}" value="${esc(value)}" ${attrs || ''} class="${inputCls}" />`; }
function select(name, list, current) { return `<select name="${name}" class="${inputCls}">${opts(list, current)}</select>`; }
function staffSelect(name, current) {
  const names = appState.staff.map(s => s.name);
  if (current && names.indexOf(current) === -1) names.unshift(current);
  if (!names.length) return input(name, current || '', 'placeholder="Name"');
  return select(name, names, current);
}

function openLeadModal(leadId) {
  const ex = leadId ? appState.leads.find(l => l.leadId === leadId) : null;
  openForm(ex ? `Edit Lead (${ex.leadId})` : 'Add New Solar Lead', { type: 'lead', id: leadId || null }, `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
      ${field('Client Name *', input('clientName', ex?.clientName, 'required'))}
      ${field('Phone Number *', input('phone', ex?.phone, 'required type="tel"'))}
      ${field('Location / City *', input('location', ex?.location, 'required'))}
      ${field('Project Type', select('projectType', ['Residential Rooftop', 'Commercial', 'Industrial'], ex?.projectType))}
      ${field('Capacity (kW) *', input('capacityKw', ex?.capacityKw ?? 5, 'type="number" step="0.5" min="0" required'))}
      ${field('Quote Value (₹) *', input('quoteValue', ex?.quoteValue ?? 300000, 'type="number" min="0" required'))}
      ${field('Assigned Sales Rep', staffSelect('salesRep', ex?.salesRep || session.user))}
      ${field('Site Survey Date', input('surveyDate', ex?.surveyDate || todayISO(), 'type="date"'))}
      ${field('Pipeline Status', select('status', ['New', 'Survey Done', 'Quote Sent', 'Negotiation', 'Won', 'Lost'], ex?.status || 'New'), true)}
      ${field('Roof &amp; Shading Assessment Notes', `<textarea name="roofNotes" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-300">${esc(ex?.roofNotes)}</textarea>`, true)}
    </div>
    <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm">Save Lead</button>`);
}

function autoSelectStaffDept(sel) {
  const dept = sel.options[sel.selectedIndex]?.getAttribute('data-dept');
  if (dept) document.getElementById('eodDeptSelect').value = dept;
}

async function handleFormSubmit(e) {
  e.preventDefault();
  if (busy) return;
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  const ctx = currentModalContext;
  let table, record, toastMsg, afterSave;

  if (ctx.type === 'lead') {
    table = 'leads';
    record = Object.assign({}, data, ctx.id ? { leadId: ctx.id } : {});
    const existing = ctx.id ? appState.leads.find(l => l.leadId === ctx.id) : null;
    toastMsg = 'Lead saved!';
    if (data.status === 'Won' && !(existing && existing.projectId)) afterSave = key => convertLeadToProject(key);
  } else if (ctx.type === 'execution') {
    table = 'execution'; record = Object.assign({ projectId: ctx.id }, data); toastMsg = 'Site execution updated!';
  } else if (ctx.type === 'discom') {
    table = 'discom'; record = Object.assign({ projectId: ctx.id }, data); toastMsg = 'DISCOM & subsidy status updated!';
  } else if (ctx.type === 'inventory') {
    if (Number(data.reservedStock) > Number(data.currentStock)) return showToast('Reserved cannot be more than stock in hand.', 'error');
    table = 'inventory'; record = Object.assign({}, data, ctx.id ? { itemId: ctx.id } : {}); toastMsg = 'Inventory updated!';
  } else if (ctx.type === 'payment') {
    const total = ['advancePaid', 'preDispatchPaid', 'postInstallPaid', 'finalPaid'].reduce((s, k) => s + (Number(data[k]) || 0), 0);
    if (total > Number(data.contractValue) && !confirm(`Collected (${formatINR(total)}) is more than the contract value (${formatINR(data.contractValue)}). Save anyway?`)) return;
    table = 'payments'; record = Object.assign({ projectId: ctx.id }, data); toastMsg = 'Payment milestone saved!';
  } else if (ctx.type === 'eod') {
    table = 'eodLogs'; record = Object.assign({}, data, { blockers: data.blockers || 'None' }); toastMsg = 'Daily EOD log submitted!';
    if (data.staffName && data.staffName !== session.user) { session.user = data.staffName; writeStore(SESSION_KEY, session); document.getElementById('whoAmI').textContent = session.user; }
  }

  setBusy(form, true);
  const key = await saveRecord(table, record);
  setBusy(form, false);
  if (!key) return; // error already shown, form stays open so nothing is lost
  closeModal('formModal');
  renderCurrentTab();
  showToast(toastMsg);
  if (afterSave) afterSave(key);
}

// --- 17. START ---
window.addEventListener('DOMContentLoaded', () => {
  renderNav();
  if (!session.code) { showLogin(); return; }
  document.getElementById('whoAmI').textContent = session.user;
  if (appState.execution.length || appState.leads.length) renderCurrentTab(); // instant view from cache
  refreshData(true);
  // Keep everyone's screen fresh: refresh every 60 s while the app is open and no form is being filled.
  setInterval(() => {
    const formOpen = !document.getElementById('formModal').classList.contains('hidden');
    if (document.visibilityState === 'visible' && !formOpen && !busy && currentTab !== 'admin') refreshData(true);
  }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshData(true); });
});
</script>
